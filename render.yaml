services:
  - type: static
    name: harman-portfolio
    staticPublishPath: .
    buildCommand: ""
    routes:
      - type: rewrite
        source: /ats_resume
        destination: /ats_resume.html
      - type: rewrite
        source: /resume
        destination: /ats_resume.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
